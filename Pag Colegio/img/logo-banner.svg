<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-label="Colegio Diferencial Mostazal">
  <!-- Logo institucional completo.
       Composición basada en la versión renovada del colegio: fondo azul
       suave, estela dorada con destellos, nombre en azul marino, MOSTAZAL
       en dorado biselado y corona de laurel.
       La estrella es la misma que usa el sitio (img/logo.svg). -->
  <defs>
    <radialGradient id="fondoAzul" cx="42%" cy="40%" r="78%">
      <stop offset="0%"   stop-color="#CBE0F2"/>
      <stop offset="62%"  stop-color="#B4D2EA"/>
      <stop offset="100%" stop-color="#9DC2E0"/>
    </radialGradient>

    <!-- Estrella: mismo degradado que logo.svg -->
    <linearGradient id="estrellaG" x1="20%" y1="8%" x2="78%" y2="95%">
      <stop offset="0%"   stop-color="#FFE372"/>
      <stop offset="52%"  stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Cintas de la estela -->
    <linearGradient id="cintaA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F0A62A" stop-opacity="0.90"/>
      <stop offset="55%"  stop-color="#F7C351" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFE9AE" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="cintaB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FBD87F" stop-opacity="0.85"/>
      <stop offset="60%"  stop-color="#FDE9B8" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- MOSTAZAL: dorado con luz arriba y sombra abajo -->
    <linearGradient id="oro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F3D385"/>
      <stop offset="30%"  stop-color="#E2B24E"/>
      <stop offset="70%"  stop-color="#D0982F"/>
      <stop offset="100%" stop-color="#B87F22"/>
    </linearGradient>

    <filter id="difuso" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="difusoSuave" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Destello de cuatro puntas, reutilizado por toda la estela -->
    <g id="chispa">
      <path d="M0,-5 Q0.9,-0.9 5,0 Q0.9,0.9 0,5 Q-0.9,0.9 -5,0 Q-0.9,-0.9 0,-5 Z"/>
    </g>
  </defs>

  <rect width="1000" height="790" fill="url(#fondoAzul)"/>

  <!-- ================= ESTELA ================= -->
  <g>
    <!-- Cinta ancha inferior, desenfocada -->
    <path d="M185 415 C 340 205, 600 118, 850 196
             C 655 214, 435 320, 240 455 Z"
          fill="url(#cintaA)" filter="url(#difuso)"/>
    <!-- Cinta media, más definida -->
    <path d="M205 385 C 355 200, 595 130, 838 200
             C 650 226, 445 318, 258 420 Z"
          fill="url(#cintaA)" filter="url(#difusoSuave)"/>
    <!-- Cinta clara superior -->
    <path d="M240 340 C 380 190, 600 138, 828 202
             C 640 214, 450 280, 285 366 Z"
          fill="url(#cintaB)" filter="url(#difusoSuave)"/>
    <!-- Hilo fino de luz -->
    <path d="M300 318 C 430 200, 620 156, 815 208"
          fill="none" stroke="#FFF4D2" stroke-opacity="0.55"
          stroke-width="7" stroke-linecap="round" filter="url(#difusoSuave)"/>
  </g>

  <!-- Destellos dispersos sobre la estela -->
  <g fill="#F6C455">
    <use href="#chispa" transform="translate(322,268) scale(1.5)"/>
    <use href="#chispa" transform="translate(398,222) scale(1.1)"/>
    <use href="#chispa" transform="translate(455,268) scale(1.8)"/>
    <use href="#chispa" transform="translate(512,196) scale(1.2)"/>
    <use href="#chispa" transform="translate(556,246) scale(2.1)"/>
    <use href="#chispa" transform="translate(614,182) scale(1.3)"/>
    <use href="#chispa" transform="translate(660,224) scale(1.6)"/>
    <use href="#chispa" transform="translate(722,186) scale(1.1)"/>
    <use href="#chispa" transform="translate(770,222) scale(1.4)"/>
    <use href="#chispa" transform="translate(352,330) scale(1.2)"/>
    <use href="#chispa" transform="translate(432,196) scale(0.9)"/>
    <use href="#chispa" transform="translate(596,268) scale(1.0)"/>
    <use href="#chispa" transform="translate(684,166) scale(0.9)"/>
  </g>
  <g fill="#FFF1CA">
    <use href="#chispa" transform="translate(368,258) scale(1.0)"/>
    <use href="#chispa" transform="translate(478,214) scale(1.3)"/>
    <use href="#chispa" transform="translate(534,290) scale(0.9)"/>
    <use href="#chispa" transform="translate(632,232) scale(1.1)"/>
    <use href="#chispa" transform="translate(700,206) scale(1.4)"/>
    <use href="#chispa" transform="translate(748,178) scale(0.8)"/>
    <use href="#chispa" transform="translate(806,214) scale(1.0)"/>
    <use href="#chispa" transform="translate(300,352) scale(0.9)"/>
  </g>
  <g fill="#FFE7A6" opacity="0.85">
    <circle cx="342" cy="300" r="3"/><circle cx="418" cy="248" r="2.4"/>
    <circle cx="496" cy="252" r="3.2"/><circle cx="574" cy="212" r="2.6"/>
    <circle cx="648" cy="252" r="2.8"/><circle cx="716" cy="238" r="2.2"/>
    <circle cx="784" cy="196" r="2.6"/><circle cx="380" cy="298" r="2.2"/>
    <circle cx="540" cy="180" r="2.4"/><circle cx="672" cy="200" r="2"/>
  </g>

  <!-- ================= ESTRELLA =================
       Idéntica a img/logo.svg, solo reescalada y sin su estela propia
       (aquí la reemplaza la estela dorada con destellos). -->
  <g transform="translate(12,186) scale(4.0)">
    <polygon points="50,14 59.8,38.3 86,39.7 65.6,56.3 72.4,81.6 50,67.4 27.6,81.6 34.4,56.3 14,39.7 40.2,38.3"
             fill="url(#estrellaG)" stroke="url(#estrellaG)"
             stroke-width="13" stroke-linejoin="round"/>
    <g fill="#FF9E5E" opacity="0.5">
      <ellipse cx="35.5" cy="55.5" rx="4.6" ry="3.1"/>
      <ellipse cx="64.5" cy="55.5" rx="4.6" ry="3.1"/>
    </g>
    <g fill="#2B4B7A">
      <ellipse cx="41.5" cy="47" rx="3.5" ry="4.4"/>
      <ellipse cx="58.5" cy="47" rx="3.5" ry="4.4"/>
    </g>
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="40.3" cy="45.4" r="1.15"/>
      <circle cx="57.3" cy="45.4" r="1.15"/>
    </g>
    <path d="M42 58.5 Q 50 65.5, 58 58.5" fill="none" stroke="#2B4B7A"
          stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- ================= NOMBRE =================
       textLength fija el ancho para que el logo no se descuadre en
       equipos que no tengan la misma tipografía instalada. -->
  <g font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif"
     font-weight="700" fill="#1E3A5F">
    <text x="492" y="334" font-size="76"
          textLength="470" lengthAdjust="spacingAndGlyphs">COLEGIO</text>
    <text x="408" y="424" font-size="76"
          textLength="554" lengthAdjust="spacingAndGlyphs">DIFERENCIAL</text>
  </g>

  <!-- MOSTAZAL: capa oscura desplazada (bisel) + relleno dorado -->
  <g font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif"
     font-weight="800">
    <text x="391" y="537" font-size="118" fill="#9A6A1B" opacity="0.55"
          textLength="586" lengthAdjust="spacingAndGlyphs">MOSTAZAL</text>
    <text x="388" y="534" font-size="118" fill="url(#oro)"
          textLength="586" lengthAdjust="spacingAndGlyphs">MOSTAZAL</text>
  </g>

  <!-- ================= CORONA DE LAUREL =================
       Se dibuja una rama y la otra es su reflejo. -->
  <g fill="#2E4C72" transform="translate(681,650)">
    <g id="rama">
      <!-- Tallo: sale del centro y se abre hacia arriba y afuera -->
      <path d="M0,0 C -25,-8 -55,-26 -88,-64" fill="none"
            stroke="#2E4C72" stroke-width="4.2" stroke-linecap="round"/>
      <!-- Hojas del lado exterior del tallo -->
      <g>
        <ellipse cx="-16" cy="-11" rx="13"  ry="5.6" transform="rotate(-38 -16 -11)"/>
        <ellipse cx="-28" cy="-18" rx="13"  ry="5.6" transform="rotate(-45 -28 -18)"/>
        <ellipse cx="-41" cy="-26" rx="12.5" ry="5.4" transform="rotate(-52 -41 -26)"/>
        <ellipse cx="-55" cy="-36" rx="11.5" ry="5"   transform="rotate(-60 -55 -36)"/>
        <ellipse cx="-69" cy="-49" rx="10"  ry="4.4" transform="rotate(-67 -69 -49)"/>
        <ellipse cx="-80" cy="-61" rx="8"   ry="3.6" transform="rotate(-73 -80 -61)"/>
      </g>
      <!-- Hojas del lado interior, más pegadas al tallo -->
      <g opacity="0.95">
        <ellipse cx="-13" cy="0"   rx="11"  ry="4.8" transform="rotate(-8 -13 0)"/>
        <ellipse cx="-26" cy="-7"  rx="11"  ry="4.8" transform="rotate(-16 -26 -7)"/>
        <ellipse cx="-39" cy="-15" rx="10.5" ry="4.6" transform="rotate(-24 -39 -15)"/>
        <ellipse cx="-52" cy="-25" rx="9.5" ry="4.2" transform="rotate(-33 -52 -25)"/>
        <ellipse cx="-64" cy="-37" rx="8"   ry="3.6" transform="rotate(-42 -64 -37)"/>
      </g>
    </g>
    <use href="#rama" transform="scale(-1,1)"/>
  </g>
</svg>
