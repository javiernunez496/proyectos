<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo Colegio Diferencial Mostazal">
  <defs>
    <!-- Degradado del cuerpo de la estrella -->
    <radialGradient id="brillo" cx="42%" cy="34%" r="72%">
      <stop offset="0%"  stop-color="#FFF6B0"/>
      <stop offset="55%" stop-color="#FFDE3A"/>
      <stop offset="100%" stop-color="#F5B912"/>
    </radialGradient>
  </defs>

  <!-- Estela de estrella fugaz -->
  <path d="M62 26 C 74 14, 88 8, 99 6 C 90 16, 78 26, 68 33 Z"
        fill="#FFDE3A" opacity="0.55"/>

  <!-- Cuerpo de la estrella.
       El stroke grueso con uniones redondeadas es lo que le da las puntas gorditas. -->
  <polygon points="50,10 60.6,37.4 90,39 67.1,57.6 74.7,86 50,70 25.3,86 32.9,57.6 10,39 39.4,37.4"
           fill="url(#brillo)" stroke="#F5B912" stroke-width="9" stroke-linejoin="round"/>

  <!-- Ojos -->
  <ellipse cx="41" cy="47" rx="6.2" ry="6.8" fill="#FFFFFF"/>
  <ellipse cx="59" cy="47" rx="6.2" ry="6.8" fill="#FFFFFF"/>
  <circle cx="41.8" cy="48" r="3.6" fill="#1B4F9C"/>
  <circle cx="59.8" cy="48" r="3.6" fill="#1B4F9C"/>
  <circle cx="40.3" cy="46.4" r="1.3" fill="#FFFFFF"/>
  <circle cx="58.3" cy="46.4" r="1.3" fill="#FFFFFF"/>

  <!-- Sonrisa -->
  <path d="M40 59 Q 50 68, 60 59" fill="none" stroke="#E07B00"
        stroke-width="3" stroke-linecap="round"/>

  <!-- Pecas -->
  <g fill="#F5A623" opacity="0.85">
    <circle cx="32.5" cy="53" r="1.5"/>
    <circle cx="35.5" cy="57" r="1.5"/>
    <circle cx="67.5" cy="53" r="1.5"/>
    <circle cx="64.5" cy="57" r="1.5"/>
  </g>
</svg>
